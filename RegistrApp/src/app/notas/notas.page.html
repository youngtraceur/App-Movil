<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <h1 class="ion-margin" class="ion-text-center">REGISTRAPP</h1>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      <ion-item routerLink="/menu">
        <ion-icon slot="start" name="apps" color="primary"></ion-icon>
        <ion-label>Menu principal</ion-label>
      </ion-item>
      <ion-item routerLink="/asignaturas">
        <ion-icon slot="start" name="book" color="primary"></ion-icon>
        <ion-label>Mis Asignaturas</ion-label>
      </ion-item>
      <ion-item routerLink="/asistencia">
        <ion-icon slot="start" name="checkbox-outline" color="primary"></ion-icon>
        <ion-label>Mis Asistencias</ion-label>
      </ion-item>
      <ion-item routerLink="/reg-asistencia">
        <ion-icon slot="start" name="add-circle-outline" color="primary"></ion-icon>
        <ion-label>Registrar Asistencia</ion-label>
      </ion-item>
      <ion-item routerLink="/cambiar-clave">
        <ion-icon slot="start" name="create" color="primary"></ion-icon>
        <ion-label>Cambiar Contraseña</ion-label>
      </ion-item>
      <ion-item routerLink="/ingresar">
        <ion-icon slot="start" name="exit" color="primary"></ion-icon>
        <ion-label>Cerrar Sesión</ion-label>
      </ion-item>
      <ion-item>
        <ion-menu-toggle>
          <ion-button>Volver</ion-button>
        </ion-menu-toggle>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/menu"></ion-back-button>
      </ion-buttons>
      <h1 class="ion-margin">Notas</h1>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" style="display: flex; justify-content: center;">
    <div>
      <ion-accordion-group expand="inset" *ngFor="let nota of notas">
        <ion-accordion>
          <ion-item slot="header" color="light">
            <ion-grid fixed>
              <ion-row style="height: 10vh; display: flex; align-items: center;">
                <ion-col size="6">{{nota.asignatura}}</ion-col>
                <ion-col size="6">{{nota.siglas}}-{{nota.seccion}}</ion-col>
              </ion-row>
            </ion-grid>
          </ion-item>
          <div class="ion-padding" slot="content">
            <ion-grid fixed>
              <ion-row>
                <ion-col size="3">Nota 1</ion-col>
                <ion-col size="3">Nota 2</ion-col>
                <ion-col size="3">Nota 3</ion-col>
                <ion-col size="3">Nota 4</ion-col>
              </ion-row>
              <ion-row>
                <ion-col size="3">{{nota.nota1}}</ion-col>
                <ion-col size="3">{{nota.nota2}}</ion-col>
                <ion-col size="3">{{nota.nota3}}</ion-col>
                <ion-col size="3">{{nota.nota4}}</ion-col>

              </ion-row>
            </ion-grid>
          </div>
        </ion-accordion>
      </ion-accordion-group>
    </div>
  </ion-content>
</div>
