<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <h1 class="ion-margin ion-text-center">REGISTRAPP</h1>
    </ion-toolbar>
  </ion-header>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/menu"></ion-back-button>
      </ion-buttons>
      <ion-title class="ion-margin">Asignaturas</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" class="ion-padding">
    <div style="display: flex; justify-content: center; align-items: center;">
      <ion-grid>
        <ion-row>
          <ion-col size="12">
            <ion-card *ngFor="let asignatura of asignaturas" class="ion-margin">
              <img src="{{asignatura.img}}" alt="imagen" style="height: 35vh; object-fit: cover;">
              <ion-card-header>
                <ion-card-title>{{asignatura.nombre}}</ion-card-title>
                <ion-card-subtitle>{{asignatura.siglas}} - {{asignatura.seccion}}</ion-card-subtitle>
              </ion-card-header>
              <ion-card-content>
                <p>Descripción: {{asignatura.descripcion}}</p> 
              </ion-card-content>
              <!-- Modificado el botón para llamar al método y guardar el IDasignatura -->
              <ion-button 
                expand="block" 
                style="padding-bottom: 15px; padding-right: 2vh; padding-left: 2vh;" 
                (click)="saveAsignaturaId(asignatura.IDasignatura)" 
                routerLink="/reg-asistencia">
                Registrar asistencia
              </ion-button>
            </ion-card>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </ion-content>
</div>
